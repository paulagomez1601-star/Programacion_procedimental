<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedidos</title>

    <link rel="stylesheet" href="../css/pedidos.css">
</head>

<body>

    <section class="section">

        <div class="container">

            <div class="box">

                <div class="box">
                    <h1 class="title is-4 has-text-centered">
                        PEDIDOS
                    </h1>
                </div>

                <div class="columns">

                    <div class="column is-3">

                        <figure class="image is-128x128">
                            <img src="https://cdn-icons-png.flaticon.com/128/3234/3234979.png">
                        </figure>

                        <br>

                    </div>

                    <div class="column">

                        <div class="box">

                            <form>

                                <div class="field">
                                    <label class="label">Producto</label>

                                    <div class="control">
                                        <input class="input" type="text" placeholder="Ingrese el producto">
                                    </div>
                                </div>

                                <div class="field">
                                    <label class="label">Dirección</label>

                                    <div class="control">
                                        <input class="input" type="text">
                                    </div>
                                </div>

                                <div class="field">
                                    <label class="label">Nombre del Usuario</label>

                                    <div class="control">
                                        <input class="input" type="text" placeholder="Ingrese el usuario">
                                    </div>
                                </div>

                                <div class="field">
                                    <label class="label">Cantidad</label>

                                    <div class="control">
                                        <input class="input" type="number" placeholder="Ingrese la cantidad">
                                    </div>
                                </div>

                                <div class="field">
                                    <label class="label">Metodo de Pago</label>

                                    <div class="control">
                                        <textarea class="textarea" placeholder="Ingrese el pago"></textarea>
                                    </div>
                                </div>

                                <div class="field">
                                    <label class="label">Telefono</label>

                                    <div class="control">
                                        <input class="input" type="number" placeholder="Ingrese su telefono">
                                    </div>
                                </div>

                                <div class="field has-text-centered">

                                    <div class="control">
                                        <button class="button is-dark is-medium" id="guardar">
                                            Guardar
                                        </button>
                                    </div>

                                    <div class="control">
                                        <a href="../index.html">
                                            <button type="button" class="button is-dark is-medium">
                                                Volver a inicio
                                            </button>
                                        </a>
                                    </div>

                                </div>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

</body>

</html>
