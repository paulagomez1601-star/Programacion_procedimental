<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedidos</title>

    <link rel="stylesheet" href="../css/pedidos.css">
</head>

<body>

    <section class="section">

        <div class="container">

            <div class="box">

                <div class="box">
                    <h1 class="title is-4 has-text-centered">
                        PEDIDOS
                    </h1>
                </div>

                <div class="columns">

                    <div class="column is-3">

                        <figure class="image is-128x128">
                            <img src="https://cdn-icons-png.flaticon.com/128/3234/3234979.png">
                        </figure>

                        <br>

                    </div>

                    <div class="column">

                        <div class="box">


                            <div class="field">
                                <label class="label">Producto</label>

                                <div class="control">
                                    <input class="input" type="text" placeholder="Ingrese el producto" id="Producto">
                                </div>
                            </div>

                            <div class="field">
                                <label class="label">Dirección</label>

                                <div class="control">
                                    <input class="input" type="text" id="Direccion">
                                </div>
                            </div>

                            <div class="field">
                                <label class="label">Nombre del Usuario</label>

                                <div class="control">
                                    <input class="input" type="text" placeholder="Ingrese el usuario"
                                        id="Nombre_usuario">
                                </div>
                            </div>

                            <div class="field">
                                <label class="label">Cantidad</label>

                                <div class="control">
                                    <input class="input" type="number" placeholder="Ingrese la cantidad" id="Cantidad">
                                </div>
                            </div>

                            <div class="field">
                                <label class="label">Modo de Pago</label>

                                <div class="control">
                                    <input class="input" type="text" placeholder="Ingrese el modo de pago"
                                        id="Modo_de_pago">
                                </div>
                            </div>

                            <div class="field">
                                <label class="label">Telefono</label>

                                <div class="control">
                                    <input class="input" type="number" placeholder="Ingrese su telefono" id="Telefono">
                                </div>
                            </div>

                            <div class="field has-text-centered">

                                <div class="control">
                                    <button class="button is-dark is-medium" id="guardar">
                                        Guardar
                                    </button>
                                </div>

                                <div class="control">
                                    <a href="../index.html">
                                        <button type="button" class="button is-dark is-medium" id="volver">
                                            Volver a inicio
                                        </button>
                                    </a>
                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/pedidos.js"></script>
    <script defer src="https://use.fontawesome.com/releases/v5.3.1/js/all.js"></script>


</body>

</html>
