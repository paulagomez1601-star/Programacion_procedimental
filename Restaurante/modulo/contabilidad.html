<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">

  <title>Contabilidad</title>
  <link rel="stylesheet" href="../css/contabilidad.css">

</head>

<body>

  <section class="section">

    <div class="container">

      <div class="box">

        <div class="box">
          <h1 class="title is-4 has-text-centered">
            CONTABILIDAD
          </h1>
        </div>

        <div class="columns">

          <div class="column is-3">

            <figure class="image is-128x128">
              <img src="https://cdn-icons-png.flaticon.com/128/5847/5847922.png">
            </figure>

            <br>

          </div>

          <div class="column">

            <div class="box">

              <form>

                <div class="field">
                  <label class="label">Ventas</label>

                  <div class="control">
                    <input class="input" type="text" placeholder="Ingrese las ventas" id="ventas">
                  </div>
                </div>

                <div class="field">
                  <label class="label">Fecha</label>

                  <div class="control">
                    <input class="input" type="date" id="fecha">
                  </div>
                </div>

                <div class="field">
                  <label class="label">Ingresos</label>

                  <div class="control">
                    <input class="input" type="number" placeholder="Ingrese ingresos" id="ingresos">
                  </div>
                </div>

                <div class="field">
                  <label class="label">Egresos</label>

                  <div class="control">
                    <input class="input" type="number" placeholder="Ingrese egresos" id="egresos">
                  </div>
                </div>

                <div class="field">
                  <label class="label">Concepto</label>

                  <div class="control">
                    <input class="input" type="text" placeholder="Ingrese el concepto" id="concepto">
                  </div>
                  
                <div class="field">
                  <label class="label">Valor</label>

                  <div class="control">
                    <input class="input" type="number" placeholder="Ingrese el valor" id="valor">
                  </div>
                </div>

                <div class="field has-text-centered">

                  <div class="control">
                    <button class="button is-dark is-medium" id="guardar">
                      Guardar
                    </button>
                  </div>

                  <div class="control">
                    <a href="../index.html">
                      <button type="button" class="button is-dark is-medium" id="volver">
                        Volver a inicio
                      </button>
                    </a>
                  </div>
                </div>

              </form>

            </div>

          </div>

        </div>

      </div>

    </div>



    </button>

  </section>
  <script defer src="https://use.fontawesome.com/releases/v5.3.1/js/all.js"></script>
  <script src="../js/contabilidad.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
