<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contabilidad</title>

  <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>

<body>

<section class="section">

  <div class="container">

    <div class="box">

      <div class="box">
        <h1 class="title is-4 has-text-centered">
          CONTABILIDAD
        </h1>
      </div>

      <div class="columns">

        <div class="column is-3">

          <figure class="image is-128x128">
            <img src="https://cdn-icons-png.flaticon.com/128/5847/5847922.png">
          </figure>

          <br>

        </div>

        <div class="column">

          <div class="box">

            <form>

              <div class="field">
                <label class="label">Ventas</label>

                <div class="control">
                  <input class="input"
                  type="text"
                  placeholder="Ingrese las ventas">
                </div>
              </div>

              <div class="field">
                <label class="label">Fecha</label>

                <div class="control">
                  <input class="input"
                  type="date">
                </div>
              </div>

              <div class="field">
                <label class="label">Ingresos</label>

                <div class="control">
                  <input class="input"
                  type="number"
                  placeholder="Ingrese ingresos">
                </div>
              </div>

              <div class="field">
                <label class="label">Egresos</label>

                <div class="control">
                  <input class="input"
                  type="number"
                  placeholder="Ingrese egresos">
                </div>
              </div>

              <div class="field">
                <label class="label">Concepto</label>

                <div class="control">
                  <textarea class="textarea"
                  placeholder="Ingrese el concepto"></textarea>
                </div>
              </div>

              <div class="field">
                <label class="label">Valor</label>

                <div class="control">
                  <input class="input"
                  type="number"
                  placeholder="Ingrese el valor">
                </div>
              </div>

              <div class="field has-text-centered">

                <div class="control">
                  <button class="button is-dark is-medium">
                    Guardar
                  </button>
                </div>

              </div>

            </form>

          </div>

        </div>

      </div>

    </div>

  </div>

</section>

</body>
</html>
